# STELLAR CCC public website. The former Business Center source remains in this repository,
# but only ccc-site is published. Legacy scripts are not part of the CCC build.
[build]
  publish = "ccc-site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
