# STELLAR CCC public website. The former Business Center source remains in this repository,
# but only ccc-site is published. Legacy scripts are not part of the CCC build.
[build]
  publish = "ccc-site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # The Supabase project URL is public (used in browser code); it is also a fallback in
  # netlify/functions/lib/ccc-store.mjs, so secret scanning must not treat it as a secret.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions."ccc-intake-webhook"]
  timeout = 20

# ElevenLabs tools for the Customer Care Center agent (start_session, submit_lead).
# Requires CCC_INTAKE_WEBHOOK_SECRET in the x-intake-secret header.
[[redirects]]
  from = "/api/ccc/intake"
  to = "/.netlify/functions/ccc-intake-webhook"
  status = 200
  force = true

# ElevenLabs post-call webhook (HMAC signed with ELEVENLABS_POSTCALL_SECRET).
[[redirects]]
  from = "/api/ccc/postcall"
  to = "/.netlify/functions/ccc-postcall-webhook"
  status = 200
  force = true

# Simulation Testing panel (same system as the PMA, Specialist and Sales sites).
[functions."ops-admin-api"]
  timeout = 26

[[redirects]]
  from = "/api/ops/*"
  to = "/.netlify/functions/ops-admin-api"
  status = 200
  force = true

[[redirects]]
  from = "/admin/testing/script/*"
  to = "/admin/testing-history.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/testing"
  to = "/admin/testing.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/ops/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
